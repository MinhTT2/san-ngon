<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#f6f8f6;color:#0F3D2E;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #dce5df">
      <p style="font-size:14px;font-weight:bold">SÂN NGON</p>
      <h1 style="font-size:24px">Xác nhận email của bạn</h1>
      <p style="line-height:1.6">Nhập mã dưới đây trên trang Sân Ngon để hoàn tất đăng ký:</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
      <p style="line-height:1.6">Mã có hiệu lực trong 10 phút và chỉ dùng một lần. Không chia sẻ mã này với bất kỳ ai.</p>
      <p style="font-size:13px;line-height:1.6">Nếu bạn không đăng ký tài khoản Sân Ngon, hãy bỏ qua email này.</p>
    </main>
  </body>
</html>
